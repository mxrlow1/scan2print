name: iOS app (build check / TestFlight)

# Without secrets: unsigned build check (always passes if the code compiles) + downloadable artifacts.
# With App Store Connect API key secrets (paid Apple Developer account): signed archive -> TestFlight upload.
#   Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of AuthKey_XXXX.p8, raw or base64), APPLE_TEAM_ID
#   Optional repository variable: IOS_BUNDLE_ID (default io.github.mxrlow1.scan2print.scanner)

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'io.github.mxrlow1.scan2print.scanner' }}
  SCHEME: Scan2PrintScanner
  PROJECT: ios/Scan2PrintScanner.xcodeproj

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check for signing secrets
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -version
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets found: will sign and upload build ${{ github.run_number }} to TestFlight."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build only::Add ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID secrets to enable TestFlight uploads (see ios/README.md)."
          fi

      - name: MeshCore unit tests
        run: |
          xcrun swiftc -O ios/Scan2PrintScanner.swiftpm/Sources/MeshCore.swift ios/Tests/MeshCoreTests/main.swift -o "$RUNNER_TEMP/meshcore-tests"
          "$RUNNER_TEMP/meshcore-tests"

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml

      - name: Unsigned build check (generic iOS device)
        run: |
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet
          echo "BUILD OK"

      - name: Build the Swift Playgrounds package directly (informational)
        continue-on-error: true
        working-directory: ios/Scan2PrintScanner.swiftpm
        run: |
          xcodebuild -list || true
          xcodebuild build -scheme "Scan2Print Scanner" -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-swiftpm" CODE_SIGNING_ALLOWED=NO -quiet

      - name: Package artifacts (Playgrounds package + unsigned .ipa)
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          (cd ios && zip -qry "$RUNNER_TEMP/out/Scan2PrintScanner.swiftpm.zip" Scan2PrintScanner.swiftpm -x '*/.build/*')
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' | head -1)
          cp -R "$APP" "$RUNNER_TEMP/out/Payload/"
          (cd "$RUNNER_TEMP/out" && zip -qry Scan2PrintScanner-unsigned.ipa Payload && rm -rf Payload)
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: Scan2PrintScanner-${{ github.run_number }}
          path: ${{ runner.temp }}/out/*
          retention-days: 30

      # ---------------- signed path (only with secrets) ----------------
      - name: Install App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 is not a valid .p8 key"; exit 1; }
          cp "$KEY" "$HOME/.appstoreconnect/private_keys/"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (automatic signing with the API key)
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Scan2PrintScanner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet

      - name: Export App Store .ipa
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Scan2PrintScanner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "::notice title=Uploaded::Build ${{ github.run_number }} sent to App Store Connect. It appears in TestFlight after processing (usually 5-30 min)."

      - name: Remove API key
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -rf "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
