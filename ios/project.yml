# XcodeGen spec used by CI (.github/workflows/ios.yml) to build/sign the same sources as the Swift Playgrounds package.
# Generate locally on a Mac with:  brew install xcodegen && xcodegen generate --spec ios/project.yml
name: Scan2PrintScanner
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Scan2PrintScanner:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Scan2PrintScanner.swiftpm/Sources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Scan2Print Scanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: The camera and LiDAR scanner capture a 3D mesh of your object.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mxrlow1.scan2print.scanner
        PRODUCT_NAME: Scan2PrintScanner
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
